[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip over offset pairs (xs, xs[1:]) is intentionally unequal

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
addopts = "-q"
